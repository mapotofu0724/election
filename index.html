<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115年志工會議幹部選舉計票系統</title>
    <style>
        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { 
            text-align: center; 
            color: #333; 
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.1); 
        }
        .note {
            text-align: center;
            color: #d9534f;
            font-weight: bold;
            margin-bottom: 20px;
            background-color: #fdf2f2;
            padding: 10px;
            border-radius: 6px;
        }
        .candidates-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 15px; 
            margin-top: 20px; 
        }
        .candidate-card { 
            background: #e9ecef; 
            padding: 15px; 
            border-radius: 8px; 
            text-align: center; 
            border: 2px solid transparent; 
            transition: 0.2s; 
        }
        .candidate-card:hover { 
            border-color: #007bff; 
            background-color: #e2e6ea;
        }
        .name { 
            font-size: 1.3em; 
            font-weight: bold; 
            margin-bottom: 5px; 
            color: #333;
        }
        .votes { 
            font-size: 2.5em; 
            color: #007bff; 
            margin: 10px 0; 
            font-weight: bold; 
        }
        .btn-group {
            display: flex;
            gap: 5px;
        }
        button { 
            color: white; 
            border: none; 
            padding: 10px 0; 
            font-size: 1.1em; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:active { 
            transform: scale(0.96); 
        }
        .add-btn {
            background: #007bff; 
            flex: 3;
        }
        .add-btn:hover { background: #0056b3; }
        .minus-btn {
            background: #6c757d;
            flex: 1;
        }
        .minus-btn:hover { background: #5a6268; }
        .controls { 
            text-align: center; 
            margin-top: 40px; 
        }
        .reset-btn { 
            background: #dc3545; 
            width: auto; 
            padding: 10px 30px;
        }
        .reset-btn:hover { 
            background: #c82333; 
        }
        .ranking { 
            margin-top: 40px; 
            padding: 25px; 
            background: #fff3cd; 
            border-radius: 10px; 
            border-left: 6px solid #ffc107;
        }
        .ranking h2 { 
            margin-top: 0; 
            color: #856404;
        }
        #ranking-list {
            font-size: 1.2em; 
            line-height: 2;
            margin: 0;
            padding-left: 20px;
        }
        #ranking-list li {
            margin-bottom: 5px;
        }
        .rank-1 { color: #d35400; font-weight: bold; font-size: 1.2em; background-color: #ffe8cc; padding: 0 10px; border-radius: 5px;}
        .rank-2 { color: #2980b9; font-weight: bold; font-size: 1.1em; background-color: #d6eaf8; padding: 0 10px; border-radius: 5px;}
        .rank-3 { color: #27ae60; font-weight: bold; background-color: #d5f5e3; padding: 0 10px; border-radius: 5px;}
        .title-badge { margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>115年8月19日 志工會議計票板</h1>
        <p class="note">⚠️ 選舉規則：依票數高低推選為團長一人，副團長兼組長一人，組長兩人。</p>
        
        <div class="candidates-grid" id="grid">
            <!-- 候選人會由 JavaScript 動態產生在這裡 -->
        </div>

        <div class="ranking" id="ranking-section">
            <h2>🏆 即時得票排名與預估當選人</h2>
            <ol id="ranking-list"><li>目前尚未開始計票</li></ol>
        </div>

        <div class="controls">
            <button class="reset-btn" onclick="resetVotes()">🔄 全數重新計票</button>
        </div>
    </div>

    <script>
        // 原始簽到表名單
        const allMembers = [
            "李淑卿", "羅苑付", "黃鳳雀", "蘇錦有", "籃錦雀", 
            "陳秀鳳", "謝淑華", "施麗娟", "朱玉子", "張金治", 
            "蘇淨純", "林碧玉", "黃素玉", "潘素珍", "林純", 
            "鄭彩琴", "梁翠英", "翁小華"
        ];

        // 僅排除現任團長「蘇錦有」
        const candidates = allMembers.filter(name => name !== "蘇錦有");
        
        let votes = {};

        // 初始化所有候選人的票數為 0
        candidates.forEach(name => {
            votes[name] = 0;
        });

        // 產生計票卡片
        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            candidates.forEach(name => {
                const card = document.createElement('div');
                card.className = 'candidate-card';
                card.innerHTML = `
                    <div class="name">${name}</div>
                    <div class="votes" id="vote-${name}">${votes[name]}</div>
                    <div class="btn-group">
                        <button class="add-btn" onclick="changeVote('${name}', 1)">+1 票</button>
                        <button class="minus-btn" onclick="changeVote('${name}', -1)">-1</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            updateRanking();
        }

        // 變更票數 (增加或減少)
        function changeVote(name, amount) {
            if (amount === -1 && votes[name] === 0) return; // 票數不低於0

            votes[name] += amount;
            document.getElementById(`vote-${name}`).innerText = votes[name];
            
            // 如果是加票，加入簡單的點擊動畫效果
            if (amount > 0) {
                const voteDisplay = document.getElementById(`vote-${name}`);
                voteDisplay.style.transform = "scale(1.3)";
                setTimeout(() => { voteDisplay.style.transform = "scale(1)"; }, 150);
            }
            
            updateRanking();
        }

        // 更新排名區塊與幹部分配
        function updateRanking() {
            const rankingList = document.getElementById('ranking-list');
            rankingList.innerHTML = '';
            
            // 將有得票的候選人依票數由高到低排序
            const sorted = Object.entries(votes)
                .filter(([name, count]) => count > 0)
                .sort((a, b) => b[1] - a[1]);

            if (sorted.length === 0) {
                rankingList.innerHTML = '<li>目前尚未開始計票</li>';
                return;
            }

            // 根據名次分配幹部頭銜
            sorted.forEach(([name, count], index) => {
                const li = document.createElement('li');
                let titleHTML = "";
                
                // 設定前四名的職位與樣式
                if (index === 0) {
                    li.className = "rank-1";
                    titleHTML = `<span class="title-badge">👑 團長</span>`;
                } else if (index === 1) {
                    li.className = "rank-2";
                    titleHTML = `<span class="title-badge">⭐ 副團長兼組長</span>`;
                } else if (index === 2 || index === 3) {
                    li.className = "rank-3";
                    titleHTML = `<span class="title-badge">🎖️ 組長</span>`;
                }

                li.innerHTML = `${name}：獲得 ${count} 票 ${titleHTML}`;
                rankingList.appendChild(li);
            });
        }

        // 重新計票機制
        function resetVotes() {
            if (confirm("⚠️ 確定要將所有人的票數都歸零重新計算嗎？")) {
                candidates.forEach(name => votes[name] = 0);
                // 更新畫面上的數字
                candidates.forEach(name => {
                    document.getElementById(`vote-${name}`).innerText = 0;
                });
                updateRanking();
            }
        }

        // 網頁載入時首次渲染
        renderGrid();
    </script>
</body>
</html>
